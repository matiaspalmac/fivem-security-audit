name: Validate
on: [push, pull_request]
jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Validate skill frontmatter and package
        run: node .github/validate.mjs

      - name: Validate checks, corpus and SKILL.md consistency
        run: node .github/oracle-check.mjs
